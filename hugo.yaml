# go-theca documentation: Hugo + Hextra, built like go-fleettools/docs.
#
# Each documentation version is a separate build under
# https://go-theca.github.io/docs/<version>/, where <version> is the minor
# version of the code the pages describe, or "main" while no release is tagged.
baseURL: "https://go-theca.github.io/docs/main/"
title: "go-theca docs"

# themes/hextra is the tannevaled/hextra fork, pinned at a release tag as a
# submodule.
theme: hextra

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

languages:
  en:
    label: "English"
    contentDir: content/en
    weight: 1

enableRobotsTXT: true
enableGitInfo: true

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        title: true
        block: true
  highlight:
    noClasses: false

# The content is NOT under content/en/docs: this site is served AT /docs/.
# Hextra picks its documentation layout from the section being called "docs",
# so the type is cascaded instead.
cascade:
  - target:
      path: "/**"
    params:
      type: docs

params:
  docs:
    version: "main"
  description: "go-theca: Theca, an encrypted container format in pure Go, at the design stage."
  navbar:
    displayTitle: true
    displayLogo: false
  theme:
    default: system
    displayToggle: true
  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: false
  page:
    width: normal
  editURL:
    enable: true
    base: "https://github.com/go-theca/docs/edit/main/content/en"
